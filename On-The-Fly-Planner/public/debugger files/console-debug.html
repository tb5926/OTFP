<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DCS API Debugger</title>
    <style>
        body { font-family: monospace; background: #222; color: #0f0; padding: 20px; }
        button { 
            background: #444; color: #fff; border: 1px solid #666; 
            padding: 10px 20px; cursor: pointer; font-size: 14px; margin: 5px;
        }
        button:hover { background: #666; }
        .instructions { color: #aaa; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 20px;}
        .log-area { margin-top: 20px; color: #fff; }
    </style>
</head>
<body>

    <h1>DCS DATA INSPECTOR</h1>
    <div class="instructions">
        <p><strong>INSTRUCTIONS:</strong></p>
        <ol>
            <li>Press <strong>F12</strong> (or Right Click -> Inspect) to open your Browser Developer Tools.</li>
            <li>Click the <strong>"Console"</strong> tab in the Developer Tools.</li>
            <li>Click the buttons below to dump raw data.</li>
        </ol>
    </div>

    <div>
        <button onclick="fetchAll()">LOG EVERYTHING</button>
        <br><br>
        <button onclick="fetchEndpoint('/mission-data')">Log Mission & Weather</button>
        <button onclick="fetchEndpoint('/position-player')">Log Player Position</button>
        <button onclick="fetchEndpoint('/engine-info')">Log Engine Data</button>
        <button onclick="fetchEndpoint('/export-world-objects')">Log World Objects (Units)</button>
        <button onclick="fetchEndpoint('/payload-info')">Log Weapons/Payload</button>
    </div>

    <div class="log-area" id="status">
        Ready. Check console (F12).
    </div>

    <script>
        const API = "http://127.0.0.1:58080";

        async function fetchEndpoint(endpoint) {
            document.getElementById('status').innerText = `Fetching ${endpoint}...`;
            
            try {
                const response = await fetch(API + endpoint);
                if(!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                
                // Group the logs to make them collapsible and clean
                console.groupCollapsed(`DATA: ${endpoint} @ ${new Date().toLocaleTimeString()}`);
                console.log("Endpoint:", endpoint);
                console.log("Raw Object:", data);
                
                // If it's the world objects, show a table for easier reading
                if(endpoint === '/export-world-objects') {
                    console.log("Table View (First 50 items):");
                    // Convert object to array for table view, limit to 50 so browser doesn't freeze
                    const preview = Object.values(data).slice(0, 50); 
                    console.table(preview);
                }
                
                console.groupEnd();
                document.getElementById('status').innerText = `Success! Data logged to Console for ${endpoint}`;

            } catch (err) {
                console.error(`FAILED to fetch ${endpoint}`, err);
                document.getElementById('status').innerText = `Error fetching ${endpoint}. Is Sim running?`;
            }
        }

        function fetchAll() {
            console.clear();
            console.log("--- STARTING FULL DUMP ---");
            fetchEndpoint('/mission-data');
            fetchEndpoint('/position-player');
            fetchEndpoint('/engine-info');
            fetchEndpoint('/payload-info');
            fetchEndpoint('/export-world-objects');
        }
    </script>
</body>
</html>
