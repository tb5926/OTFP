<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DCS API Debugger</title>
    
    <!-- FIX: Use CDN link to guarantee loading -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <style>
        body { font-family: monospace; background: #222; color: #0f0; padding: 20px; }
        button { 
            background: #444; color: #fff; border: 1px solid #666; 
            padding: 10px 20px; cursor: pointer; font-size: 14px; margin: 5px;
        }
        button:hover { background: #666; }
        .instructions { color: #aaa; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 20px;}
        .log-area { margin-top: 20px; color: #fff; }
        
        /* Sniffer Styles */
        .sniffer-box {
            border: 1px solid #e74c3c;
            background: #110000;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
        }
        .sniffer-log {
            height: 200px;
            overflow-y: scroll;
            background: #000;
            border: 1px solid #551111;
            padding: 10px;
            color: #ff9999;
            font-size: 12px;
            margin-top: 10px;
        }
        .new-item { animation: flash 1s; }
        @keyframes flash { from { background-color: #442222; } to { background-color: transparent; } }
    </style>
</head>
<body>

    <h1>DCS DATA INSPECTOR</h1>
    <div class="instructions">
        <p><strong>INSTRUCTIONS:</strong></p>
        <ol>
            <li>Ensure Node.js Server is running (<code>npm start</code>).</li>
            <li>Press <strong>F12</strong> to open Console.</li>
            <li>Click buttons below to dump raw data from Hook.</li>
        </ol>
    </div>

    <div>
        <button onclick="fetchAll()">LOG EVERYTHING</button>
        <br><br>
        <button onclick="fetchEndpoint('/mission-data')">Log Mission & Weather</button>
        <button onclick="fetchEndpoint('/position-player')">Log Player Position</button>
        <button onclick="fetchEndpoint('/engine-info')">Log Engine Data</button>
        <button onclick="fetchEndpoint('/export-world-objects')">Log World Objects (Units)</button>
        <button onclick="fetchEndpoint('/payload-info')">Log Weapons/Payload</button>
    </div>

    <!-- NEW ORDNANCE SNIFFER UI -->
    <div class="sniffer-box">
        <h3 style="margin-top:0; color:#e74c3c;">LIVE ORDNANCE SNIFFER (TCP Stream)</h3>
        <label>
            <input type="checkbox" id="chkLogWeapons"> 
            <strong>Capture Weapons (Category 0)</strong>
        </label>
        <button onclick="document.getElementById('weaponLog').innerHTML = ''" style="padding: 2px 8px; font-size: 11px;">Clear Log</button>
        
        <div id="weaponLog" class="sniffer-log">
            Waiting for weapon release...
        </div>
    </div>

    <div class="log-area" id="status">
        Ready. Check console (F12).
    </div>

    <script>
        const API = "http://127.0.0.1:58080";

        // --- FETCH LOGIC (Hook) ---
        async function fetchEndpoint(endpoint) {
            document.getElementById('status').innerText = `Fetching ${endpoint}...`;
            
            try {
                const response = await fetch(API + endpoint);
                if(!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                
                console.groupCollapsed(`DATA: ${endpoint} @ ${new Date().toLocaleTimeString()}`);
                console.log("Endpoint:", endpoint);
                console.log("Raw Object:", data);
                
                if(endpoint === '/export-world-objects') {
                    console.log("Table View (First 50 items):");
                    const preview = Object.values(data).slice(0, 50); 
                    console.table(preview);
                }
                
                console.groupEnd();
                document.getElementById('status').innerText = `Success! Data logged to Console for ${endpoint}`;

            } catch (err) {
                console.error(`FAILED to fetch ${endpoint}`, err);
                document.getElementById('status').innerText = `Error fetching ${endpoint}. Is Sim running?`;
            }
        }

        function fetchAll() {
            console.clear();
            console.log("--- STARTING FULL DUMP ---");
            fetchEndpoint('/mission-data');
            fetchEndpoint('/position-player');
            fetchEndpoint('/engine-info');
            fetchEndpoint('/payload-info');
            fetchEndpoint('/export-world-objects');
        }

        // --- SOCKET LOGIC (TCP Stream) ---
        // We connect to the Node Server running on localhost:3000
        const socket = io('http://localhost:3000'); 
        const seenWeapons = new Set(); 

        socket.on('connect', () => {
            console.log("Debugger connected to Node Server via Socket.io");
        });

        socket.on('dcsUpdate', (data) => {
            // Only process if checkbox is checked
            if (!document.getElementById('chkLogWeapons').checked) return;
            
            if (data.units) {
                const logBox = document.getElementById('weaponLog');
                
                data.units.forEach(u => {
                    // Check: Cat 0 (Weapon) OR Name keyword
                    const n = u.n.toLowerCase();
                    const isWeapon = u.c === 0 || n.includes("shell") || n.includes("missile") || n.includes("bomb") || n.includes("rocket");

                    if (isWeapon) {
                        if (!seenWeapons.has(u.i)) {
                            seenWeapons.add(u.i);
                            
                            const timestamp = new Date().toLocaleTimeString();
                            const entry = `[${timestamp}] ID: ${u.i} | NAME: "${u.n}" | Type: ${u.c} | Co: ${u.co}`;
                            
                            const div = document.createElement('div');
                            div.className = "new-item";
                            div.innerText = entry;
                            
                            // Insert at top
                            logBox.insertBefore(div, logBox.firstChild);
                            
                            console.log("WEAPON SNIFFED:", u);
                        }
                    }
                });
            }
        });

    </script>
</body>
</html>
